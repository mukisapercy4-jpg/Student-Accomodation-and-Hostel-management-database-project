services:
  - type: web
    name: sahms-backend
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn SAHMS.wsgi:application"
    plan: free
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CORS_ALLOW_ALL_VERCEL
        value: "True"
