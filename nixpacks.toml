# Railway build configuration - Python + Node.js (for Vite frontend)
[phases.setup]
nixPkgs = ["python311", "nodejs_20"]

[phases.install]
cmds = [
    "npm install --prefix frontend",
    "pip install -r requirements.txt",
]

[phases.build]
cmds = [
    "npm run build --prefix frontend",
    "python manage.py collectstatic --noinput",
]

[start]
cmd = "python manage.py migrate --run-syncdb && gunicorn SAHMS.wsgi --bind 0.0.0.0:$PORT"
